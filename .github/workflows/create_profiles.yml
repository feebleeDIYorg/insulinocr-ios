name: 3. Prepare App Profiles

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check existing profiles, or explicitly prepare app profiles using the existing certificate
        type: choice
        required: true
        default: check
        options: [check, prepare_profiles]

permissions:
  contents: read

concurrency:
  group: insulinocr-signing-store
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 30
    environment: testflight
    env:
      CI: "true"
      FASTLANE_OPT_OUT_USAGE: "1"
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Xcode
        run: |
          set -euo pipefail
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 27.1"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 27A9275"

      - name: Set up pinned Ruby and gems
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: 3.4.12
          bundler: 4.0.20
          bundler-cache: true

      - name: Verify pinned Ruby dependencies
        run: |
          set -euo pipefail
          test "$(ruby -e 'print RUBY_VERSION')" = "3.4.12"
          bundle exec ruby -rbundler -e 'abort("Unexpected Bundler #{Bundler::VERSION}") unless Bundler::VERSION == "4.0.20"'
          bundle check
          bundle exec ruby -e 'abort unless Gem::Specification.find_by_name("fastlane").version.to_s == "2.241.1"'
          git diff --exit-code -- Gemfile.lock

      - name: Synchronize ephemeral runner clock
        timeout-minutes: 1
        run: sudo sntp -sS time.windows.com

      - name: Run protected setup operation
        env:
          INSULINOCR_BUILD_CONFIG: ${{ secrets.INSULINOCR_BUILD_CONFIG }}
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_READONLY: ${{ inputs.mode == 'prepare_profiles' && 'false' || 'true' }}
          INSULINOCR_DELIVERY_MODE: ${{ inputs.mode == 'prepare_profiles' && 'profiles_apply' || 'profiles_check' }}
        run: bundle exec ruby Scripts/run_testflight.rb
